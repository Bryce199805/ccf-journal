name: public-gateway

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/bryce/app/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/bryce/app/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    networks:
      - shared-proxy

networks:
  shared-proxy:
    external: true
    name: shared-proxy
