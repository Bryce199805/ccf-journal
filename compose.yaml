name: ccf-directory

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ccf-directory:local
    container_name: ccf-directory
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    volumes:
      - ./docker/data:/app/data
    environment:
      DB_PATH: /app/data/ccf.db
      PORT: "8080"
      FRONTEND_DIR: /app/frontend
      SCHEMA_PATH: /app/db/schema.sql
      IMPORT_PATH: /app/db/import_data.json
      JWT_SECRET_FILE: /app/data/jwt_secret
      GIN_MODE: release
      TZ: "${TZ:-Asia/Shanghai}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/stats"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
